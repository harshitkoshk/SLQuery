services:
  - type: web
    name: slquery-streetlight-monitoring
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: DATABASE_URL
        fromDatabase:
          name: slquery-db
          property: connectionString
      - key: FRONTEND_URL
        value: "*"

databases:
  - name: slquery-db
    plan: free
